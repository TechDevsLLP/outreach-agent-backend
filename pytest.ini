[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    unit: pure-logic tests, no network beyond the test DB
    api: endpoint tests via ASGI client + outflo_v3_test DB (externals mocked)
    perf: READ-ONLY performance measurements against the real outflo_v3 DB
    smoke_real: opt-in tests that hit real paid providers (excluded by default)
    slow: expensive setup tests (e.g. full Atlas index build); excluded by default, run with -m slow
addopts = -m "not smoke_real and not slow" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:motor.*
    ignore::DeprecationWarning:pymongo.*
    ignore:datetime.datetime.utcnow:DeprecationWarning
